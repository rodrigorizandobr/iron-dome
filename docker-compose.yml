services:
  localstack:
    image: localstack/localstack
    container_name: api-ai-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3,sqs,sns,dynamodb,iam,lambda,secretsmanager,logs,apigateway
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - './infra/localstack:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
