name: Project Board Sync

# Polls GitHub Projects v2 every 5 minutes.
# When a card is in an actionable column (refinement, dev, dev-test, testing, pr)
# and no board-agents pipeline is currently running, dispatches workflow_dispatch
# on board-agents.yml with the correct stage + issue_number.
#
# State is tracked purely by project column — no labels involved.
# Each agent, when done, moves the card to the next column via move-card.py.
#
# REQUIREMENTS:
#   - Set repo variable PROJECT_NUMBER to your Projects v2 number.
#   - If project is private or org-level, create a classic PAT with 'project'
#     scope and store it as GH_TOKEN secret (or a separate PROJECT_TOKEN secret).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync Project Columns → Dispatch Agents
        run: python3 .github/scripts/sync-project.py

