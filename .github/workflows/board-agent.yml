name: Board Agent v2

# Event-driven + cron fallback
# Copilot Coding Agent uses native custom_agent assignment
# Custom agents defined in .github/agents/*.agent.md
# Environment setup in .github/copilot-setup-steps.yml
# Shared memory in .github/decisions.md

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (empty = all pending)'
        required: false
        type: string
      target_column:
        description: 'Move card to this column before processing'
        required: false
        type: string
  issues:
    types: [opened, assigned]
  projects_v2_item:
    types: [created, edited]
  pull_request:
    types: [opened, closed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: board-agent
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Process board cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          MANUAL_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          TARGET_COLUMN: ${{ github.event.inputs.target_column || '' }}
        run: python3 .github/scripts/board-agent.py
