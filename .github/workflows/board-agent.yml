name: Board Agent v2

# Event-driven orchestration (mostly reactive, minimal polling)
# - issues/PRs/comments trigger immediately
# - cron 1x/hour is a safety-net fallback only
# Custom agents: .github/agents/*.agent.md
# Shared memory: .github/decisions.md

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (empty = all pending)'
        required: false
        type: string
      target_column:
        description: 'Move card to this column before processing'
        required: false
        type: string
  issues:
    types: [opened, assigned, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: board-agent
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Skip noise: only react to Copilot/bot comments, not human chatter
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.user.login, '[bot]') ||
      contains(github.event.comment.user.login, 'copilot')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Process board cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          MANUAL_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          TARGET_COLUMN: ${{ github.event.inputs.target_column || '' }}
        run: python3 .github/scripts/board-agent.py
