name: Board Agent v3

# Runs every 1 minute. Processes all non-done cards without "processing" label.
# For each card: find agent → assign Copilot → wait → advance → loop.
# Testing column runs npm run ci directly (pass→next, fail→dev).
# Agents: .github/agents/{column}.agent.md
# Shared memory: .github/decisions.md

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (empty = all pending)'
        required: false
        type: string
      target_column:
        description: 'Move card to this column before processing'
        required: false
        type: string
  schedule:
    - cron: '* * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: board-agent
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Process board cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          MANUAL_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          TARGET_COLUMN: ${{ github.event.inputs.target_column || '' }}
        run: python3 .github/scripts/board-agent.py
