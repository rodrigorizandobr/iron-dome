name: Autonomous Board Agents

on:
  # Trigger unico: Manual dispatch ou via project-sync.yml (workflow_dispatch)
  workflow_dispatch:
    inputs:
      stage:
        description: 'Select stage to run'
        required: true
        default: 'refinament'
        type: choice
        options:
          - refinament
          - dev
          - dev-test
          - testing
          - pr
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Validate workflow was triggered with inputs
  validate:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.validate.outputs.stage }}
      issue: ${{ steps.validate.outputs.issue }}
    steps:
      - name: ✅ Validate and Output Stage
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGER="${{ github.event_name }}"
          STAGE=""
          ISSUE=""

          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
            ISSUE="${{ github.event.inputs.issue_number }}"
          fi

          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          echo "Trigger: $TRIGGER | Stage: $STAGE | Issue: #$ISSUE"

          if [ -z "$STAGE" ] || [ -z "$ISSUE" ]; then
            echo "ERROR: stage e issue_number sao obrigatorios!"
            exit 1
          fi

  # ==========================================
  # 1. REFINAMENT
  # ==========================================
  agent-refinament:
    needs: [validate]
    if: needs.validate.outputs.stage == 'refinament'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: � Carregar Agent Instructions
        id: agent_instructions
        run: |
          AGENT_FILE=".github/agents/refinement.agent.md"
          if [ -f "$AGENT_FILE" ]; then
            echo "✅ Agent file found: $AGENT_FILE"
            CONTENT=$(cat "$AGENT_FILE")
            echo "instructions<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Agent file not found: $AGENT_FILE"
            echo "instructions=No agent instructions found." >> $GITHUB_OUTPUT
          fi

      - name: � Carregar Detalhes da Issue
        id: issue_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(gh issue view ${{ needs.validate.outputs.issue }} --json title -q '.title')
          ISSUE_BODY=$(gh issue view ${{ needs.validate.outputs.issue }} --json body -q '.body // "sem descricao"')

          # Use multiline output para evitar problemas com caracteres especiais
          echo "title<<TITLE_EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "TITLE_EOF" >> $GITHUB_OUTPUT

          echo "body<<BODY_EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "BODY_EOF" >> $GITHUB_OUTPUT

      - name: 🔍 Refinar Issue (IA)
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
          ISSUE_TITLE: ${{ steps.issue_details.outputs.title }}
          ISSUE_BODY: ${{ steps.issue_details.outputs.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_INSTRUCTIONS: ${{ steps.agent_instructions.outputs.instructions }}
        run: npx ts-node scripts/agents/refinament.ts

      - name: 💬 Comentar na Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ needs.validate.outputs.issue }}" --body "✅ Refinement concluido. Avancando para Dev."

      - name: 📦 Mover Card para Dev
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          TARGET_COLUMN: Dev
        run: python3 .github/scripts/move-card.py

      - name: 🚀 Disparar Agent Dev automaticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run board-agents.yml \
            --repo ${{ github.repository }} \
            -f stage=dev \
            -f issue_number=${{ needs.validate.outputs.issue }}

  # ==========================================
  # 2. DEV — GitHub Copilot Coding Agent
  # ==========================================
  # Creates feat/issue-X branch, posts implementation spec to issue,
  # and assigns to GitHub Copilot coding agent.
  #
  # Workflow:
  # 1. Dev Agent posts detailed checklist comment
  # 2. Copilot reads issue and checklist
  # 3. Copilot creates code on feat/issue-X branch
  # 4. Copilot opens a PR
  # 5. copilot-pr.yml detects PR → advances card to Dev-Test
  # ==========================================
  agent-dev:
    needs: [validate]
    if: needs.validate.outputs.stage == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔧 Configurar Git
        run: |
          git config user.name "Dev Agent"
          git config user.email "dev-agent@iron-dome.local"
          git fetch origin

      - name: 🔍 Carregar Detalhes da Issue
        id: issue_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE=$(gh issue view ${{ needs.validate.outputs.issue }} --json title -q '.title')
          ISSUE_BODY=$(gh issue view ${{ needs.validate.outputs.issue }} --json body -q '.body // "sem descricao"')

          echo "title<<TITLE_EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "TITLE_EOF" >> $GITHUB_OUTPUT

          echo "body<<BODY_EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "BODY_EOF" >> $GITHUB_OUTPUT

      - name: 🤖 Preparar para GitHub Copilot
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
          ISSUE_TITLE: ${{ steps.issue_details.outputs.title }}
          ISSUE_BODY: ${{ steps.issue_details.outputs.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx ts-node scripts/agents/dev.ts

      - name: 📌 Aguardando GitHub Copilot
        run: |
          echo "✅ Dev Agent preparado para GitHub Copilot"
          echo ''
          echo '📋 Próximas etapas:'
          echo '1. GitHub Copilot lê issue e checklist'
          echo '2. Copilot implementa funções na branch feat/issue-${{ needs.validate.outputs.issue }}'
          echo '3. Copilot abre um PR'
          echo '4. Workflow copilot-pr.yml detecta PR'
          echo '5. Card avança para Dev-Test automaticamente'
          echo ''

  # ==========================================
  # 3. DEV-TEST
  # ==========================================
  agent-dev-test:
    needs: [validate]
    if: needs.validate.outputs.stage == 'dev-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ needs.validate.outputs.issue }} || echo "Branch not found, staying on main"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 📄 Carregar Agent Instructions
        id: agent_instructions
        run: |
          AGENT_FILE=".github/agents/dev-test.agent.md"
          if [ -f "$AGENT_FILE" ]; then
            echo "✅ Agent file found: $AGENT_FILE"
            CONTENT=$(cat "$AGENT_FILE")
            echo "instructions<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Agent file not found: $AGENT_FILE"
            echo "instructions=No agent instructions found." >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Desenvolver Testes Unitários (IA)
        env:
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_INSTRUCTIONS: ${{ steps.agent_instructions.outputs.instructions }}
        run: npx ts-node scripts/agents/dev-test.ts

      - name: 📝 Commitar Testes
        run: |
          git config user.name "AI Tester"
          git config user.email "ai-tester@iron-dome.local"
          git add .
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "test: testes unitarios gerados pela IA"
          git push origin feat/issue-${{ needs.validate.outputs.issue }} || echo "Push failed or branch not found"

      - name: 💬 Comentar na Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ needs.validate.outputs.issue }}" --body "✅ Testes gerados. Avancando para Testing."

      - name: 📦 Mover Card para Testing
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          TARGET_COLUMN: Testing
        run: python3 .github/scripts/move-card.py

      - name: 🚀 Disparar Agent Testing automaticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run board-agents.yml \
            --repo ${{ github.repository }} \
            -f stage=testing \
            -f issue_number=${{ needs.validate.outputs.issue }}

  # ==========================================
  # 4. TESTING (Feedback Loop)
  # ==========================================
  agent-testing:
    needs: [validate]
    if: needs.validate.outputs.stage == 'testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ needs.validate.outputs.issue }} || echo "Branch not found, staying on main"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔄 Rodar CI Completo
        id: run_ci
        run: |
          # Roda todos os gates e captura saída completa
          set +e
          npm run ci > ci_output.txt 2>&1
          CI_EXIT=$?
          set -e

          # Detecta qual gate falhou
          FAILED_GATE="unknown"
          if grep -qE "FAIL|ERROR" ci_output.txt; then
            FAILED_GATE=$(grep -E "FAIL|ERROR" ci_output.txt | head -1)
          fi

          echo "exit_code=$CI_EXIT" >> $GITHUB_OUTPUT
          echo "failed_gate=$FAILED_GATE" >> $GITHUB_OUTPUT

          if [ $CI_EXIT -eq 0 ]; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "CI failed (exit $CI_EXIT). Last 40 lines:"
            tail -40 ci_output.txt
          fi

      - name: 💬 Comentar CI Passou
        if: steps.run_ci.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ needs.validate.outputs.issue }}"
          gh issue comment "$ISSUE_NUM" --body "✅ CI passou! Todos os gates ok. Avancando para PR."

      - name: 📦 Mover Card para PR
        if: steps.run_ci.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          TARGET_COLUMN: PR
        run: python3 .github/scripts/move-card.py

      - name: 🚀 Disparar Agent PR automaticamente
        if: steps.run_ci.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run board-agents.yml \
            --repo ${{ github.repository }} \
            -f stage=pr \
            -f issue_number=${{ needs.validate.outputs.issue }}

      - name: ❌ CI Falhou → Evidência + Retorno para Dev
        if: steps.run_ci.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ needs.validate.outputs.issue }}"
          FAILED_GATE="${{ steps.run_ci.outputs.failed_gate }}"
          CI_LOG=$(cat ci_output.txt | head -40 | sed "s/\`/'/g")
          gh issue comment "$ISSUE_NUM" --body "❌ CI falhou no gate: ${FAILED_GATE}

          Log (primeiras 40 linhas):
          \`\`\`
          ${CI_LOG}
          \`\`\`

          Retornando para Dev."

      - name: 📦 Mover Card de volta para Dev
        if: steps.run_ci.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          TARGET_COLUMN: Dev
        run: |
          python3 .github/scripts/move-card.py
          echo "CI falhou no gate: ${{ steps.run_ci.outputs.failed_gate }} - retornando para dev"
          exit 1

  # ==========================================
  # 5. PR (Criacao de PR + Move para Done)
  # ==========================================
  agent-pr:
    needs: [validate]
    if: needs.validate.outputs.stage == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Carregar Agent Instructions
        id: agent_instructions
        run: |
          AGENT_FILE=".github/agents/pr.agent.md"
          if [ -f "$AGENT_FILE" ]; then
            echo "Agent file found: $AGENT_FILE"
            CONTENT=$(cat "$AGENT_FILE")
            echo "instructions<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Agent file not found: $AGENT_FILE"
            echo "instructions=No agent instructions found." >> $GITHUB_OUTPUT
          fi

      - name: Criar Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ needs.validate.outputs.issue }}"

          # Busca dados da issue
          ISSUE_DATA=$(gh issue view "$ISSUE" --json title,body)
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['title'])")
          ISSUE_BODY=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body','') or '')")

          # Monta descricao do PR
          PR_BODY="## Resumo\n\n${ISSUE_BODY}\n\n## Pipeline\n\n- [x] Refinement\n- [x] Dev\n- [x] Dev-Test\n- [x] Testing\n- [ ] Review & Merge\n\nCloses #${ISSUE}\n\n---\n*Criado automaticamente pelo Board Agents pipeline.*"

          BRANCH="feat/issue-${ISSUE}"

          # Verifica se branch existe
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH nao encontrada no remoto."
            exit 1
          fi

          # Cria PR (ou obtem URL se ja existir)
          PR_URL=$(gh pr create \
            --title "feat: ${ISSUE_TITLE} (closes #${ISSUE})" \
            --body "$(echo -e "$PR_BODY")" \
            --base main \
            --head "$BRANCH" 2>&1) || PR_URL=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null)

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "PR URL: $PR_URL"

      - name: Mover Card para Done via Projects v2
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE: ${{ needs.validate.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
          TARGET_COLUMN: Done
        run: python3 .github/scripts/move-card.py

      - name: Comentar na Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ needs.validate.outputs.issue }}"
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          gh issue comment "$ISSUE" --body "Pipeline completo! PR criado: ${PR_URL}. Card movido para Done."
