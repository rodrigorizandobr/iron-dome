name: Autonomous Board Agents

on:
  # 🎯 Trigger 1: Manual dispatch (explícito)
  workflow_dispatch:
    inputs:
      stage:
        description: '📋 Select stage to run'
        required: true
        default: 'refinament'
        type: choice
        options:
          - refinament
          - dev
          - dev-test
          - testing
          - pr
      issue_number:
        description: '🔢 Issue number to process'
        required: true
        type: number

  # 🎯 Trigger 2: Card movido entre colunas no GitHub Projects v2
  projects_v2_item:
    types: [edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  projects: read

jobs:
  # Validate workflow was triggered with inputs
  validate:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.validate.outputs.stage }}
      issue: ${{ steps.validate.outputs.issue }}
    steps:
      - name: ✅ Validate and Output Stage
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGER="${{ github.event_name }}"
          STAGE=""
          ISSUE=""

          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
            ISSUE="${{ github.event.inputs.issue_number }}"

          elif [ "$TRIGGER" = "projects_v2_item" ]; then
            CONTENT_TYPE="${{ github.event.projects_v2_item.content_type }}"
            FIELD_NAME="${{ github.event.changes.field_value.field_name }}"

            if [ "$CONTENT_TYPE" = "Issue" ] && [ "$FIELD_NAME" = "Status" ]; then
              COLUMN="${{ github.event.changes.field_value.to.name }}"
              echo "📌 Card movido para coluna: '$COLUMN'"

              # Mapeia nome da coluna para stage do agente
              case "$COLUMN" in
                [Rr]efinament*) STAGE="refinament" ;;
                [Dd]ev-[Tt]est*|[Dd]ev\ [Tt]est*) STAGE="dev-test" ;;
                [Dd]ev) STAGE="dev" ;;
                [Tt]esting*|[Tt]estes*|[Tt]este) STAGE="testing" ;;
                [Pp][Rr]|[Pp]ull\ [Rr]equest) STAGE="pr" ;;
                *) echo "⏭️ Coluna '$COLUMN' sem agente mapeado — ignorando" ;;
              esac

              if [ -n "$STAGE" ]; then
                NODE_ID="${{ github.event.projects_v2_item.content_node_id }}"
                ISSUE=$(gh api graphql \
                  -f query='query($id:ID!){node(id:$id){...on Issue{number}}}' \
                  -f id="$NODE_ID" \
                  --jq '.data.node.number')
                echo "🔢 Issue resolvida: #$ISSUE"
              fi
            else
              echo "⏭️ Evento não é mudança de Status em Issue — ignorando"
            fi
          fi

          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          echo "🎯 Trigger: $TRIGGER | Stage: $STAGE | Issue: #$ISSUE"

          # Só falha se for dispatch manual sem valores
          if [ "$TRIGGER" = "workflow_dispatch" ] && { [ -z "$STAGE" ] || [ -z "$ISSUE" ]; }; then
            echo "❌ ERROR: workflow_dispatch requer stage e issue_number!"
            exit 1
          fi

  # ==========================================
  # 1. REFINAMENT
  # ==========================================
  agent-refinament:
    needs: [validate]
    if: needs.validate.outputs.stage == 'refinament'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔍 Refinar Issue (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
        run: npx ts-node scripts/agents/refinament.ts 2>/dev/null || echo "Agent script not yet implemented"

      - name: ✅ Avançar para Dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "dev" || true
          gh issue comment ${{ needs.validate.outputs.issue }} --body "✅ **Refinement Complete.** Manual: Run workflow again with stage=dev" || true
          echo "Next: Execute workflow_dispatch with stage=dev and issue=${{ needs.validate.outputs.issue }}"

  # ==========================================
  # 2. DEV
  # ==========================================
  agent-dev:
    needs: [validate]
    if: needs.validate.outputs.stage == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔧 Configurar Git e Branch
        run: |
          git config user.name "AI Developer"
          git config user.email "ai-dev@iron-dome.local"
          git fetch origin
          git checkout -b feat/issue-${{ needs.validate.outputs.issue }} 2>/dev/null || git checkout feat/issue-${{ needs.validate.outputs.issue }}

      - name: 💻 Desenvolver Código (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx ts-node scripts/agents/dev.ts 2>/dev/null || echo "Agent script not yet implemented"

      - name: 📝 Commitar e Avisar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git commit -m "feat: código gerado pela IA para issue #${{ needs.validate.outputs.issue }}" || echo "Sem mudanças"
          git push origin feat/issue-${{ needs.validate.outputs.issue }} --force 2>/dev/null || true
          gh issue comment ${{ needs.validate.outputs.issue }} --body "💻 **Development Complete.** Manual: Run workflow with stage=dev-test" || true

      - name: ✅ Avançar para Dev-Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "dev-test" || true
          echo "Next: Execute workflow_dispatch with stage=dev-test and issue=${{ needs.validate.outputs.issue }}"

  # ==========================================
  # 3. DEV-TEST
  # ==========================================
  agent-dev-test:
    needs: [validate]
    if: needs.validate.outputs.stage == 'dev-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ needs.validate.outputs.issue }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🧪 Desenvolver Testes Unitários (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ needs.validate.outputs.issue }}
        run: npx ts-node scripts/agents/dev-test.ts 2>/dev/null || echo "Agent script not yet implemented"

      - name: 📝 Commitar Testes
        run: |
          git config user.name "AI Tester"
          git config user.email "ai-tester@iron-dome.local"
          git add .
          git commit -m "test: testes unitários gerados pela IA" || echo "Sem mudanças"
          git push origin feat/issue-${{ needs.validate.outputs.issue }} --force 2>/dev/null || true

      - name: ✅ Avançar para Testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "testing" || true
          gh issue comment ${{ needs.validate.outputs.issue }} --body "🧪 **Tests Generated.** Manual: Run workflow with stage=testing" || true
          echo "Next: Execute workflow_dispatch with stage=testing and issue=${{ needs.validate.outputs.issue }}"

  # ==========================================
  # 4. TESTING (Feedback Loop)
  # ==========================================
  agent-testing:
    needs: [validate]
    if: needs.validate.outputs.stage == 'testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ needs.validate.outputs.issue }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: ✅ Rodar Testes Unitários e Cobertura
        id: run_tests
        run: |
          if npm run test:unit -- --coverage > test_output.txt 2>&1; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Testes Passaram → Move para PR
        if: steps.run_tests.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue comment ${{ needs.validate.outputs.issue }} --body "✅ **Tests Passed!** Coverage OK. Manual: Run workflow with stage=pr" || true
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "pr" || true
          echo "Next: Execute workflow_dispatch with stage=pr and issue=${{ needs.validate.outputs.issue }}"

      - name: ❌ Testes Falharam → Volta para DEV
        if: steps.run_tests.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          TEST_LOG=$(cat test_output.txt | head -50)
          gh issue comment ${{ needs.validate.outputs.issue }} --body "❌ **Tests Failed.** Back to Dev for fixes: \`\`\`$TEST_LOG\`\`\`" || true
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "dev" || true
          echo "Tests failed. Back to: stage=dev and issue=${{ needs.validate.outputs.issue }}"

  # ==========================================
  # 5. PR (Integração e Done)
  # ==========================================
  agent-pr:
    needs: [validate]
    if: needs.validate.outputs.stage == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ needs.validate.outputs.issue }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔐 CI (Lint + Build + Testes Integrados)
        id: ci_check
        run: |
          if npm run lint && npm run build && npm run test:integrated > ci_output.txt 2>&1; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: 🎉 CI Passou → Cria PR e Move para Done
        if: steps.ci_check.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh pr create --title "feat: Issue #${{ needs.validate.outputs.issue }}" --body "Auto-generated PR from Board Agents workflow." --base main --head feat/issue-${{ needs.validate.outputs.issue }} 2>/dev/null || echo "PR already exists"
          gh issue comment ${{ needs.validate.outputs.issue }} --body "🎉 **Pipeline Complete!** PR created and ready for merge." || true
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "done" || true
          echo "✅ Done! Issue #${{ needs.validate.outputs.issue }} completed successfully"

      - name: ❌ CI Falhou → Volta para DEV
        if: steps.ci_check.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          CI_LOG=$(cat ci_output.txt | head -50)
          gh issue comment ${{ needs.validate.outputs.issue }} --body "❌ **CI Failed.** Back to Dev: \`\`\`$CI_LOG\`\`\`" || true
          gh issue edit ${{ needs.validate.outputs.issue }} --add-label "dev" || true
          echo "CI failed. Back to: stage=dev and issue=${{ needs.validate.outputs.issue }}"
