name: Autonomous Board Agents

on:
  # 🎯 Trigger: Manual dispatch only (more reliable than auto-trigger)
  workflow_dispatch:
    inputs:
      stage:
        description: '📋 Select stage to run'
        required: true
        default: 'refinament'
        type: choice
        options:
          - refinament
          - dev
          - dev-test
          - testing
          - pr
      issue_number:
        description: '🔢 Issue number to process'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ==========================================
  # 1. REFINAMENT
  # ==========================================
  agent-refinament:
    if: github.event.inputs.stage == 'refinament'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔍 Refinar Issue (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: npx ts-node scripts/agents/refinament.ts

      - name: ✅ Avançar para Dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "dev"
          gh issue comment ${{ github.event.inputs.issue_number }} --body "✅ **Refinement Complete.** Moving to Dev stage."
          npx ts-node scripts/move-card.ts "dev" 2>/dev/null || true

  # ==========================================
  # 2. DEV
  # ==========================================
  agent-dev:
    if: github.event.inputs.stage == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔧 Configurar Git e Branch
        run: |
          git config user.name "AI Developer"
          git config user.email "ai-dev@iron-dome.local"
          git fetch origin
          git checkout -b feat/issue-${{ github.event.inputs.issue_number }} 2>/dev/null || git checkout feat/issue-${{ github.event.inputs.issue_number }}

      - name: 💻 Desenvolver Código (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx ts-node scripts/agents/dev.ts

      - name: 📝 Commitar e Avisar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git commit -m "feat: código gerado pela IA para issue #${{ github.event.inputs.issue_number }}" || echo "Sem mudanças"
          git push origin feat/issue-${{ github.event.inputs.issue_number }} --force
          gh issue comment ${{ github.event.inputs.issue_number }} --body "💻 **Development Complete.** Code committed to branch."

      - name: ✅ Avançar para Dev-Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "dev-test"
          npx ts-node scripts/move-card.ts "dev-test" 2>/dev/null || true

  # ==========================================
  # 3. DEV-TEST
  # ==========================================
  agent-dev-test:
    if: github.event.inputs.stage == 'dev-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ github.event.inputs.issue_number }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🧪 Desenvolver Testes Unitários (IA)
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: npx ts-node scripts/agents/dev-test.ts

      - name: 📝 Commitar Testes
        run: |
          git config user.name "AI Tester"
          git config user.email "ai-tester@iron-dome.local"
          git add .
          git commit -m "test: testes unitários gerados pela IA" || echo "Sem mudanças"
          git push origin feat/issue-${{ github.event.inputs.issue_number }} --force

      - name: ✅ Avançar para Testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "testing"
          npx ts-node scripts/move-card.ts "testing" 2>/dev/null || true

  # ==========================================
  # 4. TESTING (Feedback Loop)
  # ==========================================
  agent-testing:
    if: github.event.inputs.stage == 'testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ github.event.inputs.issue_number }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: ✅ Rodar Testes Unitários e Cobertura
        id: run_tests
        run: |
          if npm run test:unit -- --coverage > test_output.txt 2>&1; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Testes Passaram → Move para PR
        if: steps.run_tests.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh issue comment ${{ github.event.inputs.issue_number }} --body "✅ **Tests Passed!** Coverage OK. Moving to PR stage."
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "pr"
          npx ts-node scripts/move-card.ts "pr" 2>/dev/null || true

      - name: ❌ Testes Falharam → Volta para DEV
        if: steps.run_tests.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          TEST_LOG=$(cat test_output.txt | head -50)
          gh issue comment ${{ github.event.inputs.issue_number }} --body "❌ **Tests Failed.** Returning to Dev for fixes.
          \`\`\`
          $TEST_LOG
          \`\`\`"
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "dev"
          npx ts-node scripts/move-card.ts "dev" 2>/dev/null || true

  # ==========================================
  # 5. PR (Integração e Done)
  # ==========================================
  agent-pr:
    if: github.event.inputs.stage == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin && git checkout feat/issue-${{ github.event.inputs.issue_number }} 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: 🔐 CI (Lint + Build + Testes Integrados)
        id: ci_check
        run: |
          if npm run lint && npm run build && npm run test:integrated > ci_output.txt 2>&1; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: 🎉 CI Passou → Cria PR e Move para Done
        if: steps.ci_check.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          gh pr create --title "feat: Issue #${{ github.event.inputs.issue_number }}" --body "Auto-generated PR from Board Agents workflow." --base main --head feat/issue-${{ github.event.inputs.issue_number }} 2>/dev/null || echo "PR already exists"
          gh issue comment ${{ github.event.inputs.issue_number }} --body "🎉 **Pipeline Complete!** PR created and ready for merge."
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "done"
          npx ts-node scripts/move-card.ts "done" 2>/dev/null || true

      - name: ❌ CI Falhou → Volta para DEV
        if: steps.ci_check.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          CI_LOG=$(cat ci_output.txt | head -50)
          gh issue comment ${{ github.event.inputs.issue_number }} --body "❌ **CI Failed (Lint/Build).** Returning to Dev.
          \`\`\`
          $CI_LOG
          \`\`\`"
          gh issue edit ${{ github.event.inputs.issue_number }} --add-label "dev"
          npx ts-node scripts/move-card.ts "dev" 2>/dev/null || true
