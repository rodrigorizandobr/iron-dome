name: Copilot PR → Advance Board

# Triggered when GitHub Copilot coding agent opens a PR.
# Finds the related issue, removes the copilot-working label,
# moves the board card to Dev-Test, and dispatches the dev-test agent.

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  advance-on-copilot-pr:
    runs-on: ubuntu-latest
    # Only run for PRs opened by GitHub Copilot bot
    if: |
      startsWith(github.actor, 'github-copilot') ||
      github.actor == 'copilot-swe-agent[bot]' ||
      contains(github.actor, 'copilot')
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Extrair Número da Issue do PR
        id: extract_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "PR #${PR_NUMBER} opened by ${{ github.actor }}"
          echo "Branch: ${PR_BRANCH}"

          # Try to extract issue from branch name (e.g. copilot/fix-issue-10 or feat/issue-10)
          ISSUE=$(echo "$PR_BRANCH" | grep -oE '[0-9]+$' || true)

          # Fallback: extract from PR body (closes #N or fixes #N)
          if [ -z "$ISSUE" ]; then
            ISSUE=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #([0-9]+)' | grep -oE '[0-9]+' | head -1 || true)
          fi

          if [ -z "$ISSUE" ]; then
            echo "❌ Could not determine issue number from PR. Skipping."
            echo "issue=" >> $GITHUB_OUTPUT
          else
            echo "✅ Related issue: #${ISSUE}"
            echo "issue=${ISSUE}" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Remover Label copilot-working
        if: steps.extract_issue.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.extract_issue.outputs.issue }} \
            --remove-label "copilot-working" || true

      - name: 📋 Mover Card para Dev-Test
        if: steps.extract_issue.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ steps.extract_issue.outputs.issue }}
          TARGET_COLUMN: Dev-Test
        run: |
          python3 .github/scripts/move-card.py || true

      - name: 💬 Comentar na Issue
        if: steps.extract_issue.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          gh issue comment ${{ steps.extract_issue.outputs.issue }} \
            --body "✅ **GitHub Copilot criou o PR:** ${PR_URL}

          Avançando para Dev-Test para geração de testes e execução do CI." || true

      - name: 🚀 Disparar Agent Dev-Test
        if: steps.extract_issue.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run board-agents.yml \
            --repo ${{ github.repository }} \
            -f stage=dev-test \
            -f issue_number=${{ steps.extract_issue.outputs.issue }} || true
